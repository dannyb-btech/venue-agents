[project]
name = "va-core"
version = "0.1.0"
description = "Shared core: tenancy context, settings, telemetry, secrets, errors."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp==3.14.5",
    "azure-identity==1.26.0",
    "azure-keyvault-secrets==4.11.3",
    "azure-monitor-opentelemetry==1.8.11",
    "httpx==0.28.1",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
