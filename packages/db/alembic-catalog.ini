# Global catalog database migrations (control plane). Run from the repo root:
#   uv run alembic -c packages/db/alembic-catalog.ini upgrade head
# The connection comes from CATALOG_ADMIN_URL (va_db.settings), never from this file.

[alembic]
script_location = %(here)s/src/va_db/catalog/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
