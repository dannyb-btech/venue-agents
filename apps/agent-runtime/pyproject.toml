[project]
name = "va-agent-runtime"
version = "0.1.0"
description = "Agent runtime: Agent Framework agents and durable orchestrations."
requires-python = ">=3.12,<3.13"
dependencies = ["va-core", "va-db"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
va-core = { workspace = true }
va-db = { workspace = true }
