[project]
name = "va-action-executor"
version = "0.1.0"
description = "Action executor: performs approved actions; the only holder of write scopes."
requires-python = ">=3.12,<3.13"
dependencies = ["va-core", "va-db"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
va-core = { workspace = true }
va-db = { workspace = true }
