[project]
name = "va-platform-api"
version = "0.1.0"
description = "Platform API: tenants, users, connections, drafts, approvals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-servicebus==7.15.0",
    "fastapi==0.143.0",
    "pyjwt[crypto]==2.15.1",
    "uvicorn==0.54.0",
    "va-core",
    "va-db",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
va-core = { workspace = true }
va-db = { workspace = true }
